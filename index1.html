<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    .report-card {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 30px;
      border-radius: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .student-info {
      margin-bottom: 20px;
    }

    .student-info p {
      margin: 4px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    .total {
      font-weight: bold;
      background-color: #f0f0f0;
    }

    .grade {
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

<div class="report-card">
  <h2>Report Card</h2>

  <div class="student-info">
    <p><strong>Name:</strong>S.Valarmathi</p>
    <p><strong>Class:</strong> 10</p>
    <p><strong>Roll Number:</strong> 47</p>
    <p><strong>School:</strong> ABC High School</p>
  </div>

  <table>
    <tr>
      <th>Subject</th>
      <th>Marks Obtained</th>
      <th>Maximum Marks</th>
      <th>Grade</th>
    </tr>
    <tr>
      <td>Mathematics</td>
      <td>71</td>
      <td>100</td>
      <td class="grade">A+</td>
    </tr>
    <tr>
      <td>Science</td>
      <td>88</td>
      <td>100</td>
      <td class="grade">A</td>
    </tr>
    <tr>
      <td>English</td>
      <td>90</td>
      <td>100</td>
      <td class="grade">B+</td>
    </tr>
    <tr>
      <td>Social</td>
      <td>95</td>
      <td>100</td>
      <td class="grade">A</td>
    </tr>
    <tr>
      <td>Tamil</td>
      <td>94</td>
      <td>100</td>
      <td class="grade">A+</td>
    </tr>
    <tr class="total">
      <td>Total</td>
      <td>438</td>
      <td>500</td>
      <td>87.60%</td>
    </tr>
  </table>
</div>

</body>
</html>
