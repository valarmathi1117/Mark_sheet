<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marksheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }
        th, td {
            border: 1px solid #888;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #444;
            color: white;
        }
        .student-info td {
            text-align: left;
            border: none;
            padding: 5px 10px;
        }
        .total-row {
            font-weight: bold;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2>Student Marksheet</h2>

    <table class="student-info">
        <tr>
            <td><strong>Name:</strong> Valarmathi</td>
            <td><strong>Class:</strong> 10</td>
        </tr>
        <tr>
            <td><strong>Roll Number:</strong> 47</td>
            <td><strong>Session:</strong> 2024</td>
        </tr>
    </table>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Max Marks</th>
                <th>Marks Obtained</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>100</td>
                <td id="math">71</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>100</td>
                <td id="science">88</td>
            </tr>
            <tr>
                <td>English</td>
                <td>100</td>
                <td id="english">90</td>
            </tr>
            <tr>
                <td>tamil</td>
                <td>100</td>
                <td id="tamil">94</td>
            </tr>
            <tr>
                <td>Social</td>
                <td>100</td>
                <td id="Social">95</td>
            </tr>
            <tr class="total-row">
                <td>Total</td>
                <td>500</td>
                <td id="total"></td>
            </tr>
            <tr class="total-row">
                <td>Percentage</td>
                <td colspan="2" id="percentage"></td>
            </tr>
        </tbody>
    </table>

    <script>
        // Get marks from the table
        const marks = [
            parseInt(document.getElementById('math').textContent),
            parseInt(document.getElementById('science').textContent),
            parseInt(document.getElementById('english').textContent),
            parseInt(document.getElementById('tamil').textContent),
            parseInt(document.getElementById('Social').textContent),
        ];

        const totalMarks = marks.reduce((a, b) => a + b, 0);
        const maxTotal = 500;
        const percentage = (totalMarks / maxTotal) * 100;

        document.getElementById('total').textContent = totalMarks;
        document.getElementById('percentage').textContent = percentage.toFixed(2) + '%';
    </script>
</body>
</html>
